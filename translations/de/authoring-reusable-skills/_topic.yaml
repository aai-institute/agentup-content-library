# source: 9eecfee425505839
title: Wiederverwendbare Agent-Skills schreiben
description: Mach aus einer wiederkehrenden Aufgabe einen Agent-Skill, dem deine KI jedes Mal gleich folgt. Du schreibst und testest ihn, gibst ihm Struktur, verbindest ihn mit einer App und machst ihn teilbar.
level_question: "Was trifft am ehesten auf dich zu? A: Ich habe noch nie von Agent-Skills gehört. B: Ich nutze Skills, die andere erstellt haben. C: Ich habe einen Skill geschrieben, aber nicht getestet. D: Ich baue und teste Skills, auch mit Dateien oder Skripten."
level_map: "A: guided, B: guided, C: standard, D: fast-track"
