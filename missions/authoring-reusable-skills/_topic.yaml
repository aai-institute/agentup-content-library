title: Authoring reusable Skills
description: Turn a task you repeat into a skill your AI follows the same way every time. You write and test it, give it structure, connect it to an app and get it ready to share.
level_question: "Which is closest to you? A: I haven't heard of skills. B: I use skills that others made. C: I have written a skill, but not tested it. D: I build and test skills, also with files or scripts."
level_map: "A: guided, B: guided, C: standard, D: fast-track"